<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P1X3ELZ Video Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="cyber-grid"></div>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar glass-panel">
            <div class="brand">
                <i class="fa-solid fa-play-circle glow-icon"></i>
                <h2>P1X3ELZ <span>Player</span></h2>
            </div>
            <nav class="nav-links">
                <button class="nav-btn active" id="tab-import">
                    <i class="fa-solid fa-link"></i> Direct Link
                </button>
                <button class="nav-btn" id="tab-browse">
                    <i class="fa-brands fa-youtube"></i> Browse YouTube
                </button>
                <button class="nav-btn" id="tab-library">
                    <i class="fa-solid fa-film"></i> Imported Library
                </button>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="content-area">
            <!-- View 1: Link Importer -->
            <section id="view-import" class="view-panel active">
                <div class="card glass-panel glow-box">
                    <h2>Import YouTube Video</h2>
                    <p>Paste any YouTube URL or Video ID below to load it into P1X3ELZ Video Player.</p>
                    <div class="input-group">
                        <input type="text" id="youtube-url-input" placeholder="https://www.youtube.com/watch?v=..." />
                        <button id="btn-load-link" class="primary-btn glow-btn">
                            <i class="fa-solid fa-file-import"></i> Import Video
                        </button>
                    </div>
                </div>
            </section>

            <!-- View 2: Built-in YouTube Browser -->
            <section id="view-browse" class="view-panel">
                <div class="browser-header">
                    <div class="search-bar-container">
                        <input type="text" id="yt-search-query" placeholder="Search YouTube or paste video link..." />
                        <button id="btn-yt-search" class="primary-btn glow-btn"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
                    </div>
                </div>
                
                <div class="browser-preview-bar glass-panel glow-box" id="browser-action-bar" style="display: none;">
                    <span id="detected-video-title">Detected YouTube Video</span>
                    <button id="btn-import-detected" class="action-btn glow-btn">
                        <i class="fa-solid fa-circle-plus"></i> Import to P1X3ELZ Video Player
                    </button>
                </div>

                <div class="iframe-wrapper glass-panel">
                    <iframe id="youtube-browser-frame" src="https://www.youtube.com/embed?listType=search&list=trending" allowfullscreen></iframe>
                </div>
            </section>

            <!-- View 3: Video Player Screen -->
            <section id="view-player" class="view-panel">
                <div class="player-container">
                    <div class="video-viewport glass-panel glow-box">
                        <iframe id="main-player-frame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                    </div>
                    <div class="player-metadata glass-panel">
                        <h1 id="player-video-title">No Video Loaded</h1>
                        <div class="player-actions">
                            <button id="btn-download-options" class="secondary-btn glow-btn">
                                <i class="fa-solid fa-download"></i> Download Options
                            </button>
                            <button id="btn-save-library" class="secondary-btn glow-btn">
                                <i class="fa-solid fa-bookmark"></i> Save to Library
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- View 4: Library -->
            <section id="view-library" class="view-panel">
                <h2 class="section-title">P1X3ELZ Video Player Library</h2>
                <div class="library-grid" id="library-items">
                    <p class="empty-msg">No imported videos yet.</p>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
